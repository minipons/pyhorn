# GdB1 — matching Hornresp export parameters
# Driver: Sd=132cm², Bl=7.75, Cms=1.49E-03, Rms=0.27, Mmd=6.04, Le=0.80, Re=7.80
# Horn: S1=80cm², S2=600cm², L=1.53m, T=0.35 (hyperbolic), F12=49.02Hz
# Chamber: Vrc=5L, Lrc=15cm, Vtc=160cm³, Atc=80cm²
# Ang=0.5π (half-space radiation)

name: "GdB1 Hornresp Match"

# Driver (Hornresp: Sd=132.00cm², Bl=7.75, Cms=1.49E-03, Rms=0.27, Mmd=6.04g, Le=0.80mH, Re=7.80Ω)
# Note: Hornresp uses Mmd (diaphragm mass) not Mms
fs: 49.6    # approximate free-air resonance
qts: 0.27   # approximate total Q
qes: 0.28
qms: 7.88
vas: 0.0369   # litres → m³ (FE166NV2 spec)
re: 7.80
sd: 0.0132    # 132 cm² → m²
bl: 7.75
mms: 0.00604  # Mmd=6.04g → kg
cms: 1.49e-3  # Cms in m/N
rms: 0.27
le: 0.80e-3  # 0.80 mH → H
xmax: 0.0015  # 1.5mm

# CRIT-3: acoustic-power-based SPL calibration vs Hornresp dB/W/m
# Derived by comparing pyhorn acoustic power vs Hornresp dB/W/m reference.
# Corrects for systematic +0 to +11 dB excess in pyhorn acoustic power model.
# Format: [[freq_hz, delta_db], ...] — piecewise-linear, extrapolates at band edges.
sensitivity_db:
  - [50,    -11.3]
  - [100,   -3.6]
  - [200,   -0.3]
  - [500,   -2.5]
  - [1000,  -7.5]
  - [2000,  -8.1]
  - [5000,  -7.8]
  - [10000, -6.5]
  - [20000, -5.6]

# Horn geometry
throat_area: 0.0080   # S1=80cm² → m²
mouth_area: 0.0600      # S2=600cm² → m²
path_length: 1.530     # Hyp=153cm → m
n_segments: 50
profile_type: hyperbolic
hyperbolic_t: 0.35

# Throat adapter (from Hornresp: AT=0.91 sr, Atc=80cm²)
ap1: 0.0080   # Atc=80cm² → m²
lpt: 0.0

# Rear chamber (Hornresp: Vrc=5.00L, Lrc=15.00cm, Vtc=160cm³, Atc=80cm²)
# chamber_type="coupling" = pure compliance model (stiffness only, no mass resonance).
#   CRIT-1 investigation (May 5 2026) showed Hornresp's BLH rear chamber behaves as a
#   coupling chamber (pure stiffness), NOT a vented-box Helmholtz resonator.
#   The vented model catastrophically worsens 20-50 Hz (-13 to -25 dB vs Hornresp).
#   See: GdB/sprints/2026-05-05.md — CRIT-1 Deep Dive.
# NOTE: hornresp_spl.csv reference was generated with the OLD vented model and is STALE.
#   It must be regenerated with the coupling model once Geopan provides calibration data.
rear_chamber:
  vrc: 0.005    # 5L → m³
  lrc: 0.15     # 15cm → m
  fr_rc: 2000    # flow resistivity Rayls/m
  chamber_type: coupling  # pure compliance model — correct for BLH coupling chamber

# Throat chamber (Hornresp: Vtc=160cm³, Atc=80cm²)
vtc: 0.00016  # 160cm³ → m³
atc: 0.0080   # Atc=80cm² → m²
fr_tc: 2000

# Radiation angle (Hornresp: Ang=0.5π sr)
ang: 1.5708   # 0.5π

# Drive (Hornresp: Eg=2.83V, Rg=0.00Ω)
voltage: 2.83

# Enclosure
enclosure_type: BLH
width: 0.30
enclosure_dims: [0.30, 0.60]
thickness: 0.02
