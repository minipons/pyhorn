# Example project YAML for BK16 1m
# The 'geometry' path is relative to this file's location.
# Fields here are preserved across re-runs of auto-segment.

name: "BK16 mk1"
geometry_path: ../source/bk16_mk1.yaml   # relative to this file's location   # regenerated by auto-segment; this file survives

driver_coord: [0.01, 0.0]     # (x, y) driver position in metres for 2D schematic
enclosure_dims: [0.36, 0.72] # (depth_m, height_m) bounding box for 2D schematic

rear_chamber:
  vrc: 0.00324     # volume (m³)
  lrc: 0.10        # average acoustic length (m) — 18 cm box depth
  fr_rc: 2000      # flow resistivity of damping (Rayls/m) — wool/felt
  chamber_type: coupling  # BLH coupling chamber: pure stiffness (no resonance peak)
  width: 0.224      # m — for 2D schematic
  height: 0.19     # m — for 2D schematic
  depth: 0.10      # m — for 2D schematic

# ── Throat chamber (tiny sealed volume at horn throat) ───────────────────
# Driver → throat chamber → horn path → mouth
# 2.2 cm × 2.0 cm opening, ~2 cm deep → 8.8 cL
# throat_chamber:
#   vtc: 0.000088    # volume (m³) — tiny sealed back-volume
#   atc: 0.0044      # cross-sectional area at throat (m²) — horn throat opening
#   fr_tc: 5000   

# Optional: override the segments used in the 2D folded-horn plot.
# Use this when the acoustic geometry (rectangular_segments) differs from
# the desired visual representation. Each entry: (h_start_m, h_end_m, length_m)
# fold_plot_segments:
#   - [0.06, 0.06, 0.05]
#   - [0.08, 0.10, 0.04]

notes: "Fostex FE166NV2 in BK16 1m cabinet, 35L internal"
