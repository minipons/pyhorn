[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhorn_cli"
version = "0.1.0"
description = "CLI for pyhorn acoustic horn simulator"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyhorn_core",
    "typer>=0.9.0",
]

[project.scripts]
pyhorn = "pyhorn_cli.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyhorn_cli*"]
