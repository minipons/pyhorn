# Hornresp FLH Reference Geometry
# Hornresp parameters (converted to SI):
#   S1 (throat): 40 cm² = 0.004 m²
#   S2 (mouth):  300 cm² = 0.03 m²
#   Path length: 152.7 cm = 1.527 m
#   F12 (cutoff): 50.43 Hz
#   T (hyperbolic): 0.30
#   Ang (radiation angle): 0.5π sr (half-space)
#   Vrc (rear chamber): 3.24 L = 0.00324 m³
#   Lrc (rear chamber depth): 12.0 cm = 0.12 m
#   Vtc (throat chamber): 88.0 cm³ = 0.000088 m³
#   Atc (throat chamber area): 250.18 cm² = 0.025018 m²

enclosure_type: FLH
profile_type: hyperbolic
hyperbolic_t: 0.30

throat_area: 0.004
mouth_area: 0.03
path_length: 1.527

# Rear chamber (sealed)
vrc: 0.00324
lrc: 0.12

# Throat chamber
vtc: 0.000088
atc: 0.025018

# Radiation angle (half-space: 0.5π steradians)
# Note: pyhorn stores this as ang; used in FDD directivity model
ang: 1.570796

# Discretisation
n_segments: 100
