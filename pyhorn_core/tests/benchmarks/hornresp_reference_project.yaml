# Hornresp Benchmark Project — FLH reference comparison
# Combines hornresp_reference_driver.yaml + hornresp_reference_flh.yaml
# Purpose: Validate pyhorn vs Hornresp SPL/impedance/excursion

name: hornresp_flh_reference
geometry_path: hornresp_reference_flh.yaml

# Driver is in same directory; path resolved by pyhorn
driver_coord: [0.0, 0.0]
width: 0.0

# Enclosure
enclosure: [0.4, 0.5]
thickness: 0.015

notes: |
  Hornresp FLH benchmark reference.
  Driver: Hornresp Mmd=6.12g (not FE166NV2 spec 6.99g).
  Horn: S1=40cm², S2=300cm², L12=1.527m, F12=50.43Hz, T=0.30.
