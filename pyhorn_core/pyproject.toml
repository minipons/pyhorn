[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhorn_core"
version = "0.1.0"
description = "Headless acoustic horn loudspeaker simulator — core library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["solver*", "config*", "output*", "integrations*"]

[tool.setuptools.package-dir]
"" = "."
