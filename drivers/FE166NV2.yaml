# Fostex FE166NV2
fs: 49.6
qts: 0.27
qes: 0.28
qms: 7.88
vas: 0.0369
re: 7.8
bl: 7.79
# mms = Mmd (diaphragm-only mass). pyhorn adds radiation mass via Zrad on top,
# so the YAML field should hold Mmd, not the published "Mms" (which includes
# air load and would double-count when Zrad is added).
# Hornresp params for HiroB use Mmd=6.04g.
mms: 0.00604
cms: 0.001472
rms: 0.277
sd: 0.0132
le: 0.0008
xmax: 0.001

# Lossy Le model (Hornresp page 77): frequency-dependent eddy-current shunt
# resistance R_lossy(f) = R_e_eddy × (f/f_ref)². Adds dissipation at HF
# representing motor-system eddy losses.
lossy_le: true
le_R_e_eddy: 0.5
le_f_lossy_ref: 5000.0

# HF-only CRIT-3 sensitivity correction on spl_power_based, calibrated against
# tests/benchmarks/hornresp_gdb1/hornresp_spl_hirob.csv with ap1=0 + chamber_type=coupling.
# LF/MF need no correction (within ±1 dB); HF tapers off the known +5-6 dB excess.
sensitivity_db:
  - [200,  -0.5]
  - [500,  -2.0]
  - [1000, -4.0]
  - [2000, -6.0]
  - [5000, -6.0]

# Measured free-air SPL curve from the FE166NV2 manufacturer datasheet
# (1 W / 1 m, baffled).  When this is set, the orchestrator scales the direct
# cone pressure to match this curve — captures cone breakup and motor
# non-linearities the lumped TS model cannot predict.
spl_response: spl.csv


